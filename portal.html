<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <header>
        Dashboard
    </header>
    
    <main>

        <aside id="menu" class="principal">
            Menu
        </aside>

        <section class="principal">
            <section id="topo">

                <div class="blocos">
                    <div class="icones">
                        <img src="Img/icone_alunos.png" alt="">
                    </div>

                    <div class="dados">
                        <p class="titulo">Alunos Matriculados</p>
                        <p class="numero">512</p>
                        <p><span class="span_verde">+32</span> este mês</p>
                    </div>

                    <div class="seta">
                        <img src="Img/seta_alunos.png" alt="">
                    </div>
                </div>

                <div class="blocos">
                    <div class="icones">
                        <img src="Img/icone_turmas.png" alt="">
                    </div>

                    <div class="dados">
                        <p class="titulo">Turmas</p>
                        <p class="numero">24</p>
                        <p><span class="span_verde">+2</span> este mês</p>
                    </div>

                    <div class="seta">
                        <img src="Img/seta_turmas.png" alt="">
                    </div>
                </div>

                <div class="blocos">
                    <div class="icones">
                        <img src="Img/icone_professores.png" alt="">
                    </div>
                    <div class="dados">
                        <p class="titulo">Professores</p>
                        <p class="numero">38</p>
                        <p><span class="span_verde">+1</span> este mês</p>
                    </div>

                    <div class="seta">
                        <img src="Img/seta_professores.png" alt="">
                    </div>
                </div>

                <div class="blocos">
                    <div class="icones">
                        <img src="Img/icone_frequencia.png" alt="">
                    </div>
                    <div class="dados">
                        <p class="titulo">Frequência Média</p>
                        <p class="numero">92,4%</p>
                        <p><span class="span_verde">+4,6%</span> este mês</p>
                    </div>
                    
                    <div class="seta">
                        <img src="Img/seta_frequencia.png" alt="">
                    </div>
                </div>
            </section>

            <section id="principal">
                principal
            </section>
        </section>

    </main>

    <footer>
        <div class="span1">B.A.S.E.</div>
        <div class="span2">Base de Acompanhamento do Sistema Escolar</div>
        <div class="span3">®2026 - Projeto acadêmico</div>
    </footer>
</body>
</html>
